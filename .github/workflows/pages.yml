# Publishes the design prototypes to GitHub Pages. Lives only on the
# `prototypes` branch, which holds nothing but the prototypes, so pushing here
# never touches master (master triggers Codemagic's production APK build).
name: Publish prototypes

on:
  push:
    branches: [prototypes]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
